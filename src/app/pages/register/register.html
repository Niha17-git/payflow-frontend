<div class="login-container">
  <div class="login-card">
    <h1>PayFlow</h1>
    <p class="subtitle">Create an account</p>
    <form (ngSubmit)="onSubmit()">
      <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Full Name" required>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required>
      <select [(ngModel)]="role" name="role">
        <option value="FinanceUser">Finance User</option>
        <option value="Admin">Admin</option>
      </select>
      <button type="submit">Register</button>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
    </form>
    <p class="link"><a routerLink="/login">Already have an account? Login</a></p>
  </div>
</div>
